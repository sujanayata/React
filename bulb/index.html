<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bulb ON / OFF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <!-- <h2>Bulb ON / OFF</h2> -->

    <div class="bulb-wrapper">
      <img id="bulb" src="bulb1.webp" alt="Bulb">

    <div class="buttons">
      <button id="onBtn" onclick="bulbOn()">ON</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
